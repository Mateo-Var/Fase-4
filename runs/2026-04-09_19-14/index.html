<script id="qa-broken-red">
(function() {
  var BROKEN_RED = '#f85149';
  var BROKEN_YELLOW = ['#ffd050', '#FFD050', 'ffd050'];

  function fixBrokenColor() {
    document.querySelectorAll('.chart__fill_status_broken').forEach(function(el) {
      el.setAttribute('fill', BROKEN_RED);
      el.style.fill = BROKEN_RED;
    });
    document.querySelectorAll('path[fill], circle[fill], rect[fill], polygon[fill]').forEach(function(el) {
      var f = el.getAttribute('fill') || '';
      if (BROKEN_YELLOW.some(function(y){ return f.toLowerCase().includes(y.toLowerCase()); })) {
        el.setAttribute('fill', BROKEN_RED);
      }
    });
    document.querySelectorAll('.chart__legend-icon_status_broken').forEach(function(el) {
      el.style.background = BROKEN_RED;
      el.style.backgroundColor = BROKEN_RED;
    });
  }

  setInterval(fixBrokenColor, 700);
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(fixBrokenColor, 1000); });
})();
</script>

<style id="qa-widget-layout">
  /* Forzar columna única en el contenedor principal de Allure */
  .app__content {
    display: flex !important;
    flex-direction: column !important;
    flex-wrap: nowrap !important;
    align-items: stretch !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
  }

  /* Widgets y summary ocupan todo el ancho */
  .widget, .summary {
    flex: 0 0 auto !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    margin: 0 0 16px 0 !important;
  }

  /* Barras de suites más visibles */
  .bar { height: 24px !important; border-radius: 4px !important; }
  .bar__fill { height: 24px !important; }

  .widget__body { width: 100% !important; }
</style>

<script id="qa-widget-hider">
(function () {
  var KEEP = ['suites', 'suite'];

  function applyLayout() {
    var widgets = document.querySelectorAll('.widget');
    if (!widgets.length) return false;

    widgets.forEach(function (w) {
      // Proteger el summary — nunca ocultarlo aunque tenga clase .widget
      if (w.classList.contains('summary')) {
        w.setAttribute('style', (w.getAttribute('style') || '') +
          ';display:block!important;width:100%!important;max-width:100%!important;');
        return;
      }

      // Solo buscar por .widget__title (selector específico, no genérico)
      var titleEl = w.querySelector('.widget__title');
      var title   = titleEl ? titleEl.textContent.toLowerCase().trim() : '';
      var keep    = KEEP.some(function (k) { return title.indexOf(k) !== -1; });

      if (keep || title === '') {
        w.setAttribute('style', (w.getAttribute('style') || '') +
          ';display:block!important;width:100%!important;max-width:100%!important;');
      } else {
        w.setAttribute('style', (w.getAttribute('style') || '') +
          ';display:none!important;');
      }
    });

    var summary = document.querySelector('.summary');
    if (summary) {
      summary.setAttribute('style', (summary.getAttribute('style') || '') +
        ';display:block!important;width:100%!important;max-width:100%!important;');
    }

    return true;
  }

  var observer = new MutationObserver(function () { applyLayout(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });

  [300, 700, 1500, 3000].forEach(function (t) { setTimeout(applyLayout, t); });
})();
</script>
