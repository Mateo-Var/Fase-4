    document.querySelectorAll('.chart__fill_status_broken').forEach(function(el) {
      el.setAttribute('fill', BROKEN_RED);
      el.style.fill = BROKEN_RED;
    });
    document.querySelectorAll('path[fill], circle[fill], rect[fill], polygon[fill]').forEach(function(el) {
      var f = el.getAttribute('fill') || '';
      if (BROKEN_YELLOW.some(function(y){ return f.toLowerCase().includes(y.toLowerCase()); })) {
        el.setAttribute('fill', BROKEN_RED);
      }
    });
    document.querySelectorAll('.chart__legend-icon_status_broken').forEach(function(el) {
      el.style.background = BROKEN_RED;
      el.style.backgroundColor = BROKEN_RED;
    });
  }

  setInterval(fixBrokenColor, 700);
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(fixBrokenColor, 1000); });
})();
</script>

<script id="qa-custom-summary">
(function () {
  function modifySummary() {
    var summary = document.querySelector('.widget[data-id="summary"]');
    if (!summary) return;
    
    var title = summary.querySelector('.widget__title');
    if (title && title.innerHTML.match(/Allure Report/i)) {
      title.innerHTML = title.innerHTML.replace(/Allure Report/i, 'QA REPORT');
    }
    
    var statsNode = summary.querySelector('.summary-widget__stats');
    if (statsNode && !statsNode.hasAttribute('data-customized')) {
       statsNode.setAttribute('data-customized', 'true');
       statsNode.style.display = 'none';
       
       // Force flex layout to split text vs chart properly
       var parentContent = statsNode.parentNode;
       if (parentContent) {
           parentContent.style.display = 'flex';
           parentContent.style.alignItems = 'center';
           parentContent.style.justifyContent = 'space-between';
           parentContent.style.width = 'auto'; // Prevent overflow
           parentContent.style.boxSizing = 'border-box';
           parentContent.style.gap = '30px'; 
       }
       
       var chartNode = summary.querySelector('.summary-widget__chart');
       if (chartNode) {
           chartNode.style.flex = '0 0 auto';
           chartNode.style.marginRight = '20px'; // Beautiful safe space for the chart
       }
       
       fetch('widgets/summary.json').then(res => res.json()).then(data => {
            var s = data.statistic;
            var box = document.createElement('div');
            box.style.display = 'flex'; 
            box.style.flexDirection = 'column';
            box.style.justifyContent = 'center';
            box.style.gap = '16px'; 
            box.style.margin = '10px 0'; 
            box.style.flex = '1';
            
            function createCard(label, count, color, bg) {
               return '<div style="background:'+bg+'; border: 1px solid #30363d; border-left: 8px solid '+color+'; border-radius: 8px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">' +
                      '<div style="font-size:14px; color:#c9d1d9; font-weight: 600; text-transform:uppercase; letter-spacing: 0.5px;">' + label + '</div>' + 
                      '<div style="font-size:32px; font-weight:bold; color:'+color+'; line-height: 1;">' + (count || 0) + '</div>' +
                      '</div>';
            }
            var fallidos = (s.failed || 0) + (s.broken || 0);
            box.innerHTML = createCard('Total Casos', s.total, '#58a6ff', '#1f2428') +
                            createCard('Aprobados', s.passed, '#3fb950', '#1c2e22') +
                            createCard('Fallidos', fallidos, '#f85149', '#301c1c');
            
            // Mover el titulo fisicamente dentro de la caja para que este SIEMPRE arriba de las cards
            if (title) {
                title.style.margin = '0 0 15px 0';
                title.style.padding = '0';
                title.style.width = '100%';
                title.style.textAlign = 'left';
                box.insertBefore(title, box.firstChild);
            }
            
            statsNode.parentNode.insertBefore(box, statsNode);
       }).catch(e => console.log('Error', e));
    }
  }
  var obs = new MutationObserver(modifySummary);
  obs.observe(document.documentElement, { childList: true, subtree: true });
  [100, 500, 1500, 3000].forEach(function(t) { setTimeout(modifySummary, t); });
})();
</script>
