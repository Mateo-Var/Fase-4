<!DOCTYPE html>

    <meta charset="utf-8">

    <link rel="stylesheet" type="text/css" href="plugin/screen-diff/styles.css">




<script id="qa-widget-hider">
(function() {
  var HIDDEN_TITLES = [
    'categorías','categorias','categories','kategorien','catégories','categorie',
    'ejecutores','executors','ausführer','exécuteurs',
    'tendencia','tendências','trend','tendance','tendenza',
    'tendencia de categorías','categories trend','history trend'
  ];
  function hideWidgets() {
    var titles = document.querySelectorAll('.widget__title');
    titles.forEach(function(el) {
      var txt = (el.textContent || '').trim().toLowerCase();
      if (HIDDEN_TITLES.some(function(h){ return txt.indexOf(h) !== -1; })) {
        var widget = el.closest('.widget, .widgets-grid__col');
        if (widget) widget.style.display = 'none';
      }
    });
  }
  var lastHash = '';
  setInterval(function() {
    if (location.hash !== lastHash) { lastHash = location.hash; setTimeout(hideWidgets, 400); }
    hideWidgets();
  }, 600);
  document.addEventListener('DOMContentLoaded', function() { setTimeout(hideWidgets, 800); });
})();
</script>

<style id="qa-dark-override">
  :root { color-scheme: dark; }
  body, .app { background: #0d1117 !important; color: #e6edf3 !important; }
  /* Texto general — sobreescribe #000 y #333 hardcodeados en styles.css */
  .link { color: #58a6ff !important; }
  .table__row { color: #e6edf3 !important; }
  .tree__info { color: #e6edf3 !important; }
  .node { color: #e6edf3 !important; }
  .sorter_enabled { color: #e6edf3 !important; }
  .pane__subtitle { color: #8b949e !important; }
  .splash__subtitle { color: #8b949e !important; }
  .popover { background: #161b22 !important; color: #e6edf3 !important; border-color: #30363d !important; }
  .hljs { background: #1c2128 !important; color: #e6edf3 !important; }
  /* Navegación lateral */
  .side-nav, .side-nav__list { background: #161b22 !important; border-color: #30363d !important; }
  .side-nav__item a, .side-nav__item span { color: #8b949e !important; }
  .side-nav__item.active a { color: #58a6ff !important; background: #1c2128 !important; }
  /* Widgets y cards */
  .widget, .card, .summary, .chart-widget { background: #161b22 !important; border-color: #30363d !important; }
  .widget__title, .card__title { color: #8b949e !important; }
  .y-axis text, .x-axis text, .label { fill: #8b949e !important; }
  /* Header */
  .header { background: #161b22 !important; border-bottom: 1px solid #30363d !important; }
  .header__name { color: #e6edf3 !important; }
  /* Tabs */
  .tab, .tabs__tab { color: #8b949e !important; background: #161b22 !important; }
  .tab.active, .tabs__tab_active { color: #58a6ff !important; border-color: #58a6ff !important; }
  /* Tablas */
  .table__row, tr { border-color: #21262d !important; }
  .table__row:hover, tr:hover { background: #1c2128 !important; }
  /* Misc */
  .status-line { background: #161b22 !important; }
  .tag, .badge { background: #1c2128 !important; color: #8b949e !important; }
  a { color: #58a6ff !important; }
  /* Estados de tests — broken también en rojo */
  .passed .status, .status_passed { color: #3fb950 !important; }
  .failed .status, .status_failed,
  .broken .status, .status_broken { color: #f85149 !important; }
  .skipped .status, .status_skipped { color: #8b949e !important; }
  .chart__fill_broken, [class*="broken"] .chart__fill { fill: #f85149 !important; }
  .side-nav__item:has(a[href="#suites"]),
  .side-nav__item:has(a[href="#categories"]),
  .side-nav__item:has(a[href="#graph"]),
  .side-nav__item:has(a[href="#timeline"]),
  .side-nav__item:has(a[href="#behaviors"]),
  .side-nav__item:has(a[href="#packages"]) { display: none !important; }
</style>
<script id="qa-widget-hider">
(function() {
  var HIDDEN_TITLES = [
    'categorías','categorias','categories','kategorien','catégories','categorie',
    'ejecutores','executors','ausführer','exécuteurs',
    'tendencia','tendências','trend','tendance','tendenza',
    'tendencia de categorías','categories trend','history trend'
  ];

  function hideWidgets() {
    document.querySelectorAll('.widget__title').forEach(function(el) {
      var txt = (el.textContent || '').trim().toLowerCase();
      if (HIDDEN_TITLES.some(function(h){ return txt.indexOf(h) !== -1; })) {
        var w = el.closest('.widget, .widgets-grid__col');
        if (w) w.style.display = 'none';
      }
    });
  }

  function showFailedPanel() {
    if (document.getElementById('qa-failed-panel')) return;
    var grid = document.querySelector('.widgets-grid');
    if (!grid) return;

    fetch('data/suites.json')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var failed = [];
        function traverse(node) {
          if (node.status === 'failed' || node.status === 'broken') failed.push(node.name);
          if (node.children) node.children.forEach(traverse);
        }
        if (data.children) data.children.forEach(traverse);
        if (failed.length === 0) return;

        var panel = document.createElement('div');
        panel.id = 'qa-failed-panel';
        panel.style.cssText = 'background:#2d0a0a;border:2px solid #f85149;border-radius:10px;padding:18px 22px;margin:0 0 20px 0;grid-column:1/-1';
        panel.innerHTML =
          '<div style="color:#f85149;font-weight:700;font-size:16px;margin-bottom:12px;letter-spacing:.02em">✖ ' +
          failed.length + ' test' + (failed.length > 1 ? 's' : '') + ' fallaron</div>' +
          failed.map(function(n){
            return '<div style="color:#ffa0a0;font-size:13px;padding:5px 0;border-top:1px solid #4a1515">• ' + n + '</div>';
          }).join('');
        grid.insertBefore(panel, grid.firstChild);
      })
      .catch(function(){});
  }

  var lastHash = '';
  setInterval(function() {
    if (location.hash !== lastHash) {
      lastHash = location.hash;
      setTimeout(function(){ hideWidgets(); showFailedPanel(); }, 500);
    }
    hideWidgets();
  }, 600);
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function(){ hideWidgets(); showFailedPanel(); }, 900);
  });
})();
</script>
