<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Fase 4 — Reportes QA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
    header { background: #161b22; border-bottom: 1px solid #30363d; padding: 24px 40px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 20px; font-weight: 600; }
    header .subtitle { color: #8b949e; font-size: 14px; }
    .logo { width: 36px; height: 36px; background: #238636; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    main { max-width: 960px; margin: 40px auto; padding: 0 24px; }
    h2 { font-size: 16px; color: #8b949e; margin-bottom: 16px; text-transform: uppercase; letter-spacing: .05em; }
    table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; }
    th { background: #1c2128; color: #8b949e; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px; text-align: left; }
    td { padding: 14px 16px; border-top: 1px solid #21262d; font-size: 14px; }
    td a { color: #58a6ff; text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .badge { background: #1f6feb; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; font-weight: 600; }
    .pass { background: #1a3f1e; color: #3fb950; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .fail { background: #3d1a1a; color: #f85149; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .btn { background: #21262d; color: #e6edf3 !important; padding: 6px 14px; border-radius: 6px; font-size: 13px; border: 1px solid #30363d; text-decoration: none !important; }
    .btn:hover { background: #30363d; }
    .empty { text-align: center; color: #8b949e; padding: 40px; }
  </style>
</head>
